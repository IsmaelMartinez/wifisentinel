name: Release

# Attaches the Android companion APK to GitHub releases so it can be
# downloaded and sideloaded directly on a phone — no laptop required.
# Release assets (unlike Actions artifacts) are direct, un-zipped downloads
# that don't require a GitHub login.
#
# The app has no release signing key (it's a prototype — see
# android/README.md), so this ships the debug-signed build, which Android
# happily sideloads. The asset name says so explicitly.

on:
  release:
    types: [published]
  # Manual backfill for releases published before this workflow existed
  # (e.g. v1.0.0): pass the existing release's tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the APK to (e.g. v1.0.0)"
        required: true
        type: string

env:
  # Keep in sync with compileSdk in android/app/build.gradle.kts and
  # ANDROID_API_LEVEL in ci.yml.
  ANDROID_API_LEVEL: "35"

permissions:
  contents: write # upload release assets

jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On release publish, build the code the release points at. On
          # manual backfill, build the dispatching branch instead — the
          # target tag may predate the Android app entirely (v1.0.0 has no
          # android/ directory), and the companion app is versioned
          # independently of CLI releases anyway. If the dispatch itself is
          # run from a tag, fall back to the default branch for the same
          # reason.
          ref: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.event.repository.default_branch) || github.ref }}

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      # Job-scoped Gradle caching — see the note on the android job in ci.yml.
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platforms;android-${{ env.ANDROID_API_LEVEL }} build-tools;35.0.0 platform-tools

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          # Tags can legally contain "/" — sanitize the filename, upload to
          # the real tag.
          apk="wifisentinel-${TAG//\//-}-android-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          gh release upload "$TAG" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
